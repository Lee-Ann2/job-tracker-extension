<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Job Tracker Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2><i class="fas fa-chart-line"></i> Job Tracker Pro</h2>
        <p>Smart Application Management</p>
    </div>

    <div class="content">

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <div id="siteHint" class="site-hint" style="display:none;"></div>

        <div class="section">
            <h3><i class="fas fa-briefcase"></i> Job Details</h3>
            <input type="text" id="companyName" placeholder="Company Name">
            <input type="text" id="positionName" placeholder="Position Title">
            <div id="lastTrackedBadge" class="last-badge" style="display:none;"></div>
            <button id="extractBtn"><i class="fas fa-magic"></i> Extract Job Details</button>
            <button id="trackBtn" class="btn-track"><i class="fas fa-bookmark"></i> Track This Application</button>
        </div>

        <div class="section">
            <h3><i class="fas fa-sync-alt"></i> Update Status</h3>
            <select id="appSelect"></select>
            <select id="statusSelect">
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer Received</option>
                <option value="Rejected">Rejected</option>
                <option value="Ignored">Ignored</option>
            </select>
            <textarea id="statusNotes" rows="2" placeholder="Add a note (optional)..."></textarea>
            <button id="updateStatusBtn"><i class="fas fa-check-circle"></i> Update Status</button>
        </div>

        <div class="section">
            <h3><i class="fas fa-file-pdf"></i> Resume</h3>
            <input type="url" id="resumeUrl" placeholder="https://drive.google.com/your-resume-link">
            <button id="applyBtn" class="btn-apply"><i class="fas fa-external-link-alt"></i> Open Resume Link</button>
        </div>

        <div class="section">
            <h3><i class="fas fa-chart-bar"></i> Statistics</h3>
            <div id="stats" class="stats-grid"></div>
            <button id="viewAppsBtn" class="btn-view"><i class="fas fa-list"></i> View All Applications</button>
        </div>

        <div class="platform-icons">
            <span><i class="fab fa-linkedin"></i> LinkedIn</span>
            <span><i class="fas fa-search"></i> Indeed</span>
            <span><i class="fas fa-building"></i> Glassdoor</span>
        </div>

    </div>

    <div id="successAlert" class="alert-success" style="display:none;">
        <i class="fas fa-check-circle"></i> <span></span>
    </div>
    <div id="errorAlert" class="alert-error" style="display:none;">
        <i class="fas fa-exclamation-triangle"></i> <span></span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
